name: Deploy web edition to Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'design/web/**'
      - 'design/print/**'
      - 'design/cover/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source and frozen-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read toolchain pins
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pins = json.loads(Path('design/print/trial-toolchain.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('python=' + pins['python'], file=output)
              print('node=' + pins['node'].removeprefix('v'), file=output)
          PY
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r design/web/requirements.txt
          npm ci
      - name: Build and check the web edition
        run: |
          python design/web/check --static-only
          echo 'Browser checks are explicitly skipped in CI; see design/web/README.md for the exact coverage gap.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The accepted print PDF byte check is local-only; its artifact is not in Git.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: design/web/output/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
